<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gruntdeck — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <svg class="icon logo-mark" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>
      <h1>Gruntdeck</h1>
      <p>AUTOMATION CONSOLE ACCESS</p>
    </div>

    <div id="error-alert" class="alert-error"></div>

    <form id="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-login">Sign In</button>
    </form>
  </div>

  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const errElem = document.getElementById('error-alert');
      errElem.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error('Invalid username or password');
        }

        window.location.href = '/';
      } catch (err) {
        errElem.innerText = err.message;
        errElem.style.display = 'block';
      }
    }
  </script>
</body>
</html>
